# Dramarouter 应用日志轮转
#
# 应用在每次启动时按启动时间戳新建一个 oneapi-YYYYMMDDHHMMSS.log，运行期间
# 追加写同一个文件，自己不做清理。因此这里同时防两件事：
#   1. 单次运行写太大 —— maxsize 触发轮转并压缩
#   2. 重启次数多导致文件堆积 —— 由 daily + rotate 控制数量
#
# 应用以 O_WRONLY 持有 fd，必须用 copytruncate，否则重命名后进程仍写旧 inode。

/opt/1panel/apps/local/dramarouter/a-logs/oneapi-*.log
/opt/1panel/apps/local/dramarouter/b-logs/oneapi-*.log
{
    daily
    maxsize 200M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d-%s
    su root root
}
